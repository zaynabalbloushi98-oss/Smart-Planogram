<form action="/analyze" method="POST" enctype="multipart/form-data">

    <label for="planogram">
        <strong>Upload Planogram Image:</strong>
    </label>

    <input
        type="file"
        id="planogram"
        name="planogram"
        accept="image/*"
        required
    >

    <br><br>

    <label for="image">
        <strong>Upload Current Shelf Image:</strong>
    </label>

    <input
        type="file"
        id="image"
        name="image"
        accept="image/*"
        required
    >

    <br><br>

    <button type="submit">
        Analyze Shelf
    </button>

</form>
